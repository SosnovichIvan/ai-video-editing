name: Repository checks
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request direction
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = main ]; then
            test "$HEAD" = develop
            test "$SOURCE_REPO" = "$TARGET_REPO"
          else
            test "$BASE" = develop
            test "$HEAD" != main
            test "$HEAD" != develop
          fi
      - uses: actions/checkout@v4
      - name: Verify public repository contents
        shell: bash
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s CONTRIBUTING.md
          test -s docs/editing-workflow.md
          if git ls-files | grep -Ei '(^local/|^\.execution-state/|(^|/)\.env($|\.)|\.(mp4|mov|mkv|webm|mp3|wav|aac|m4a|zip|whl)$)'; then
            echo 'Local materials must not be tracked.'
            exit 1
          fi
          if git grep -n -E '[/]Users[/]|[/]home[/]|gh[pousr]_[A-Za-z0-9]{20,}' -- .; then
            echo 'Personal paths and credentials must not be published.'
            exit 1
          fi
      - name: Verify video library structure
        shell: bash
        run: |
          set -euo pipefail
          for skill in video-story video-select video-generate video-edit video-sound video-review; do
            test -s ".agents/skills/$skill/SKILL.md"
            test -s ".agents/skills/$skill/agents/openai.yaml"
          done
          for prompt in story select generate edit sound review; do
            test -s "prompts/$prompt.md"
          done
          for template in brief storyboard edit-plan review; do
            test -s "templates/$template.md"
          done
      - name: Check local Markdown links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          errors = []
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              for target in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if '://' in target or target.startswith('#'):
                      continue
                  destination = target.split('#', 1)[0]
                  if not (path.parent / destination).exists():
                      errors.append(f'{path}: missing {target}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Local Markdown links are valid')
          PY
